# Daily listing check. Runs on GitHub's servers every morning, so it needs no one to approve anything.
# Pulls each watched town's Redfin lists, updates data/listings.js, and always saves data/last-check.json.
# The 6:49am Claude scheduled task reads last-check.json and sends Kevin the email and phone alert.
name: Daily listing check
on:
  schedule:
    - cron: '7 10 * * *'   # 6:07am EDT / 5:07am EST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-listings
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull Redfin and update listings
        id: run
        run: |
          msg=$(node tools/daily-check.js | tail -n 1)
          echo "msg=$msg" >> "$GITHUB_OUTPUT"
      - name: Save results
        run: |
          git config user.name "DealDesk daily check"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.js data/watch-state.json data/last-check.json
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          msg="${{ steps.run.outputs.msg }}"
          [ -z "$msg" ] && msg="Daily listing check $(TZ=America/New_York date +%F): status only"
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
